<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DeepTalk · 五视频口播提取</title>
<style>
:root{font-family:system-ui,-apple-system,"PingFang SC",sans-serif;color:#292e2d;background:#f6f5f0;font-size:15px;line-height:1.6}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0}header{max-width:1120px;margin:auto;padding:20px 24px;display:flex;justify-content:space-between;gap:20px;border-bottom:1px solid #dedfd5}a{color:#39694f}main{max-width:960px;margin:36px auto;padding:0 24px 80px}h1{font-size:32px;font-weight:600;letter-spacing:-1px;margin-bottom:8px}h2{font-size:20px}p{color:#656b65}.panel,article{background:#fffefa;border:1px solid #dedfd5;border-radius:16px;padding:24px;margin:20px 0}label{display:block;margin:10px 0}textarea,input,select{font:inherit;border:1px solid #cbd0c7;border-radius:8px;padding:10px;max-width:100%;background:white;color:inherit}textarea{width:100%;resize:vertical;min-height:52px}input[type=checkbox]{margin-right:7px}button{font:inherit;border:1px solid #cbd0c7;background:#fffefa;border-radius:8px;padding:9px 14px;cursor:pointer;color:inherit}button.primary{background:#315a43;color:white;border-color:#315a43}button:disabled{opacity:.5;cursor:wait}.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.meta{font-size:13px;color:#646d62;overflow-wrap:anywhere}.full{white-space:pre-wrap;overflow-wrap:anywhere;margin:18px 0;line-height:1.9}.status{color:#315a43;white-space:pre-wrap;overflow-wrap:anywhere}.error{color:#a4382c}summary{cursor:pointer;font-weight:600}#history{width:100%;margin-top:8px}#validation{white-space:pre-wrap;font-size:13px}article h2{margin:0 0 8px}details{margin-top:16px}#notice{min-height:24px}#combined-actions{position:static}small{color:#656b65}nav details{margin:0}nav{display:flex;gap:16px;align-items:center}.archive-path{overflow-wrap:anywhere;color:#646d62}.task-label{width:100%}@media(max-width:600px){main{margin-top:24px;padding:0 14px 50px}header{padding:14px;gap:10px}h1{font-size:26px}.panel,article{padding:17px}nav{gap:9px;font-size:13px}button{padding:10px}input[type=number]{width:110px}}
</style></head><body>
<header><strong>DeepTalk Studio</strong><nav><a href="/settings">设置</a><details><summary>高级</summary><a href="/advanced">旧版创作与历史会话</a></details></nav></header>
<main><h1>五视频口播提取</h1><p>自己选视频，完整保留每一份口播。下载 → FFmpeg 抽音 → 本地 Whisper；提取过程无需模型 Key。</p>
<section class="panel"><div class="actions"><strong>粘贴 1～5 条 B 站链接或 BV 号</strong><button id="new">新建提取</button></div><small>支持带跟踪参数的链接及多行粘贴；重复 BV 自动合并。不自动搜索视频。</small><div id="slots"></div><div id="validation" role="status"></div>
<label for="task-label">任务名称（可选）</label><input id="task-label" class="task-label" maxlength="120" placeholder="默认为日期 + 口播提取">
<label><input id="consent" type="checkbox">我确认有权下载本批视频，授权仅在本机下载、提取音频、运行 Whisper 并保存口播转写，不重新分发媒体。</label><button id="extract" class="primary">开始提取口播稿</button>
<details><summary>已保存的提取记录</summary><select id="history" aria-label="已保存的提取记录"><option value="">选择记录</option></select></details></section>
<div id="notice" class="status" role="status" aria-live="polite"></div>
<section id="archive-info" class="panel" hidden><strong>本任务保存位置</strong><p id="archive-path" class="archive-path"></p><small id="archive-detail"></small></section>
<div id="combined-actions" class="actions" hidden><button id="copy-all" class="primary">复制全部五份</button><button id="download-all">下载合并参考稿.txt</button><small>失败项会明确标记；完整原文按视频顺序合并。</small></div>
<div id="cards"></div><details id="fusion" class="panel"><summary>可选：让 AI 融合成一篇口播稿</summary><p>也可直接复制全部原文给外部 AI。仅点击下方按钮才调用已配置的模型，可能计费。</p><label>目标字数 <input id="words" type="number" min="200" max="10000" value="1000"></label><label>风格要求 <input id="style" maxlength="1000" placeholder="有梗，按故事经过讲清楚冲突"></label><label><input id="ai-consent" type="checkbox">同意将本批完整转写发送给已配置的模型服务，并承担可能的调用费用。</label><button id="fuse">让 AI 融合成稿</button><div id="synthesis" class="full"></div><div id="synthesis-actions" class="actions" hidden></div></details>
</main><script>
'use strict';
const $=id=>document.getElementById(id);let state=null,busy=false,timer=null;const key='deeptalk.transcripts-session';
for(let i=1;i<=5;i++){let label=document.createElement('label');label.textContent='视频 '+i;let input=document.createElement('textarea');input.rows=1;input.placeholder=i===1?'https://www.bilibili.com/video/BV… 或一次粘贴多行':'可选';input.setAttribute('aria-label','视频 '+i);input.addEventListener('input',()=>{if(state){state=null;localStorage.removeItem(key);$('cards').replaceChildren();$('combined-actions').hidden=true;$('validation').textContent='';$('synthesis').textContent='';$('synthesis-actions').hidden=true;notice('链接已改变，再次提取会创建新记录，旧文件完整保留。');}});label.append(input);$('slots').append(label);}
async function api(action,data={}){const response=await fetch('/api/workbench/transcripts/'+action,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const result=await response.json();if(!response.ok){if(result.validation)validation(result.validation);throw new Error(result.error||'请求失败');}return result;}
function notice(text,error=false){$('notice').textContent=text;$('notice').className=error?'error':'status';}
function validation(rows){$('validation').textContent=rows.map(r=>r.input+' · '+r.message).join('\n');}
function download(text,name,type='text/plain'){const a=document.createElement('a');const url=URL.createObjectURL(new Blob([text],{type:type+';charset=utf-8'}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
async function copy(text){try{await navigator.clipboard.writeText(text);notice('已复制完整原文');}catch(e){notice('复制不可用，请下载TXT或选择全文复制。',true);}}
function button(text,fn){let b=document.createElement('button');b.textContent=text;b.onclick=fn;return b;}
function restoreInputs(next){const slots=[...document.querySelectorAll('#slots textarea')];slots.forEach((e,i)=>e.value=next.items[i]?next.items[i].url:'');}
function render(next){state=next;localStorage.setItem(key,state.session_id);validation(state.validation||[]);$('combined-actions').hidden=false;$('copy-all').textContent=state.items.length===5?'复制全部五份':'复制全部'+state.items.length+'份';$('cards').replaceChildren();$('archive-info').hidden=false;$('archive-path').textContent=state.batch_path||state.combined_path||'DeepTalk 会话目录';$('archive-detail').textContent=state.batch_path?'视频/、口播稿/ 与合并参考稿.txt 会自动保存到此任务文件夹。':('当前未设置保存文件夹；文件保存在本机会话目录：'+(state.combined_path||''));
const names={pending:'等待授权提取',metadata:'读取视频信息',downloading:'下载中',downloaded:'下载完成',extracting:'FFmpeg 抽音中',transcribing:'Whisper 识别中',complete:'全文已保存',failed:'失败，可重试',analysis_failed:'转写失败，可重试'};
state.items.forEach((item,index)=>{const card=document.createElement('article');let title=document.createElement('h2');title.textContent=(index+1)+'. '+item.title;card.append(title);let meta=document.createElement('div');meta.className='meta';meta.textContent=item.bvid+' · 播放量 '+(Number.isInteger(item.view_count)?item.view_count:'未知')+' · '+(names[item.status]||item.status);card.append(meta);const link=document.createElement('a');link.href=item.url;link.textContent=item.url;link.className='meta';link.target='_blank';link.rel='noopener';card.append(link);
if(item.status==='complete'){let p=document.createElement('div');p.className='meta';p.textContent='机器识别 ASR · 完整原文，可自行校订 · '+item.artifact_path;card.append(p);if(item.save_paths&&item.save_paths.transcript_txt){let saved=document.createElement('div');saved.className='meta';saved.textContent='已自动保存 TXT：'+item.save_paths.transcript_txt+'\nJSON：'+item.save_paths.transcript_json+(item.save_paths.video?'\n原视频：'+item.save_paths.video:'')+(item.save_paths.media_error?'\n'+item.save_paths.media_error:'');card.append(saved);}else if(item.save_error){let saved=document.createElement('div');saved.className='meta error';saved.textContent='保存失败：'+item.save_error+'；会话中的完整原文仍保留。';card.append(saved);}let actions=document.createElement('div');actions.className='actions';actions.append(button('复制全文',()=>copy(item.text)),button('下载本稿.txt',()=>download(item.text,item.filename)),button('下载时间码.json',()=>download(JSON.stringify(item.transcript,null,2),item.bvid+'-口播转写.json','application/json')));card.append(actions);let full=document.createElement('details');let summary=document.createElement('summary');summary.textContent='查看完整口播稿（'+item.transcript.text.length+'字）';full.append(summary);let text=document.createElement('div');text.className='full';text.textContent=item.transcript.text;full.append(text);card.append(full);
}else{let p=document.createElement('p');p.textContent=item.failure_reason||item.analysis_error||'等待本地处理，不会生成无参考长稿。';card.append(p);if(['failed','analysis_failed'].includes(item.status)){let retry=button('重试此视频',()=>process([item.bvid]));retry.disabled=busy;card.append(retry);}}$('cards').append(card);});
$('synthesis').textContent=state.synthesis?state.synthesis.text:'';$('synthesis-actions').replaceChildren();$('synthesis-actions').hidden=!state.synthesis;if(state.synthesis)$('synthesis-actions').append(button('复制融合稿',()=>copy(state.synthesis.text)),button('下载融合稿.txt',()=>download(state.synthesis.text,'融合口播稿.txt')));
$('fuse').disabled=busy||state.items.some(i=>i.status!=='complete');}
function setBusy(value){busy=value;for(const id of ['extract','new','history','fuse'])$(id).disabled=value;document.querySelectorAll('#slots textarea,#consent').forEach(e=>e.disabled=value);if(state)render(state);}
async function history(){const data=await api('sessions');$('history').replaceChildren(new Option('选择已保存记录',''));data.sessions.forEach(s=>$('history').add(new Option(s.created_at+' · '+s.count+'份 · '+s.session_id,s.session_id)));if(state)$('history').value=state.session_id;}
async function process(bvids){if(busy)return;if(!$('consent').checked){notice('请先勾选本批下载与本地分析授权。',true);return;}setBusy(true);notice('正在提取，可在每条视频卡片查看进度；失败项可单独重试。');
try{if(!state){const links=[...document.querySelectorAll('#slots textarea')].map(e=>e.value);render(await api('start',{links,label:$('task-label').value}));}timer=setInterval(async()=>{try{render(await api('state',{session_id:state.session_id}));}catch(e){}},1000);render(await api('process',{session_id:state.session_id,consent:true,...(bvids?{bvids}:{} )}));const done=state.items.filter(i=>i.status==='complete').length;notice('已保存 '+done+' / '+state.items.length+' 份完整转写'+(done===state.items.length?'。':'；失败项请重试。'));await history();}catch(e){notice(e.message,true);}finally{clearInterval(timer);setBusy(false);}}
$('extract').onclick=()=>process();$('copy-all').onclick=()=>state&&copy(state.combined_text);$('download-all').onclick=()=>state&&download(state.combined_text,'合并参考稿.txt');
$('new').onclick=()=>{state=null;localStorage.removeItem(key);$('cards').replaceChildren();$('combined-actions').hidden=true;$('archive-info').hidden=true;$('validation').textContent='';$('consent').checked=false;$('synthesis').textContent='';$('synthesis-actions').hidden=true;document.querySelectorAll('#slots textarea').forEach(e=>e.value='');$('task-label').value='';notice('');};
$('history').onchange=async()=>{if(!$('history').value)return;try{render(await api('state',{session_id:$('history').value}));restoreInputs(state);$('consent').checked=false;notice('已恢复保存的完整转写。');}catch(e){notice(e.message,true);}};
$('fuse').onclick=async()=>{if(!state||busy)return;if(!$('ai-consent').checked){notice('请明确同意调用模型，或直接复制原文给外部 AI。',true);return;}setBusy(true);notice('正在融合一篇口播稿，调用已配置模型…');try{render(await api('fuse',{session_id:state.session_id,words:Number($('words').value),style:$('style').value,consent:true}));notice('融合稿已保存，原始转写完整保留。');}catch(e){notice(e.message,true);}finally{setBusy(false);}};
(async()=>{try{await history();const sid=localStorage.getItem(key);if(sid){render(await api('state',{session_id:sid}));restoreInputs(state);}}catch(e){notice(e.message,true);}})();
</script></body></html>
